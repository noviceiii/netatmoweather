# Copy this file to config.cfg (same directory as the script) and adjust the values.
# config.cfg contains secrets: keep it private (chmod 600 config.cfg) and never commit it.

# ---------------------------------------------------------------------------
# Netatmo access
# ---------------------------------------------------------------------------

# This token can be obtained from https://dev.netatmo.com/apps (Token Generator).
# It is used for the first run. Later, the script refreshes the token on its own
# and keeps the current one in TOKEN_STORE.
# Netatmo invalidates a refresh token as soon as it has been used once. If the
# token store gets lost, generate a new token and enter it here.
# IMPORTANT: Make sure your app has the "read_station" scope enabled
REFRESH_TOKEN_INITIAL="5nnnnnnnnnnnnnnnnnnnn|5nnnnnnnnnnnnnnnnnnnn"

# further netatmo settings from https://dev.netatmo.com/apps
# app id/client id
APP_ID="123456789"
CLIENT_SECRET="eDSEF123456789efssdsd"
# Device ID of your weather station (MAC address format)
DEVICE_ID="xx:xx:xx:xx:xx:xx"

# Full path where token information is stored. The file is created automatically
# (mode 600). The directory must be writable for the user running the script:
# a temporary file and a lock file (<TOKEN_STORE>.lock) are created next to it.
TOKEN_STORE="/path/to/.tokenstore"

# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------

# display weather information or store it in a file
OUTPUT_TYPE="screen"                # "screen" or "file"

# full path to file where weather information is stored (only for OUTPUT_TYPE="file").
# The file is only replaced after the data has been fetched successfully.
OUTPUT_FILE="/path/to/weatherinfo.txt"

# Modules to show. Disable the modules your station does not have.
MAIN_MODULE="enable"                # indoor main station: "enable" or "disable"
OUTDOOR_MODULE="enable"             # outdoor module:      "enable" or "disable"
RAIN_MODULE="enable"                # rain gauge:          "enable" or "disable"
WIND_MODULE="enable"                # wind gauge:          "enable" or "disable"

# Optional: text between the modules in file output, for example " | ".
# If the line stays commented out, the layout of the previous versions is used.
#OUTPUT_SEPARATOR=", "

# "yes" prints status messages (token state and so on) to stderr.
# Warnings and errors are always printed to stderr.
VERBOSE="no"                        # "yes" or "no"
